name: Publish main container
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: container-main
  cancel-in-progress: false
jobs:
  publish:
    name: Check, test, build and publish latest
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image name
        run: echo "ROI_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"
      - uses: ./.github/actions/verify
        with:
          image: ${{ env.ROI_IMAGE }}
          version: main
      - name: Publish tested latest image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$ROI_IMAGE"
