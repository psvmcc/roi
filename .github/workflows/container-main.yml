name: Publish main container
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: container-main
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      skip_container_checks: true
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build amd64 image
        env:
          ROI_COMMIT: ${{ github.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          echo "ROI_IMAGE=$image" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 --build-arg ROI_VERSION=main --build-arg ROI_COMMIT="$ROI_COMMIT" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$ROI_COMMIT" -t "$image" .
      - name: Smoke-test publishable image
        run: sh scripts/container-smoke.sh "$ROI_IMAGE"
      - name: Publish tested latest image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$ROI_IMAGE"
