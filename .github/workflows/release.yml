name: Release
on:
  push:
    tags: ['*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Check, test, build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Set image name
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "ROI_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG" >> "$GITHUB_ENV"
      - uses: ./.github/actions/verify
        with:
          image: ${{ env.ROI_IMAGE }}
          version: ${{ github.ref_name }}
      - name: Include deployment examples
        run: cp examples/config.yaml examples/roi.container dist/
      - name: Publish tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$ROI_IMAGE"
          if [ "$PRERELEASE" = false ]; then
            stable="ghcr.io/${GITHUB_REPOSITORY,,}:stable"
            docker tag "$ROI_IMAGE" "$stable"
            docker push "$stable"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--latest)
          if [ "$PRERELEASE" = true ]; then flags=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "roi $RELEASE_TAG" --generate-notes "${flags[@]}" dist/roi-linux-amd64 dist/roi-linux-amd64.sha256 dist/roi-linux-amd64.cdx.json dist/config.yaml dist/roi.container
