name: Release
on:
  push:
    tags: ['*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      skip_container_checks: true
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build amd64 binary and inventory
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
          ROI_VERSION: ${{ github.ref_name }}
          ROI_COMMIT: ${{ github.sha }}
        run: |
          sh scripts/build.sh dist/roi-linux-amd64
          python3 scripts/artifacts.py dist/roi-linux-amd64
          cp examples/config.yaml examples/roi.container dist/
      - name: Build release image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          echo "ROI_IMAGE=$image" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 --build-arg ROI_VERSION="$RELEASE_TAG" --build-arg ROI_COMMIT="$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.version=$RELEASE_TAG" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" .
      - name: Smoke-test release image
        run: sh scripts/container-smoke.sh "$ROI_IMAGE"
      - name: Publish tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$ROI_IMAGE"
          if [ "$PRERELEASE" = false ]; then
            stable="ghcr.io/${GITHUB_REPOSITORY,,}:stable"
            docker tag "$ROI_IMAGE" "$stable"
            docker push "$stable"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--latest)
          if [ "$PRERELEASE" = true ]; then flags=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "roi $RELEASE_TAG" --generate-notes "${flags[@]}" dist/roi-linux-amd64 dist/roi-linux-amd64.sha256 dist/roi-linux-amd64.cdx.json dist/config.yaml dist/roi.container
